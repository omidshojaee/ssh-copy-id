name: Release Windows EXE

on:
  push:
    tags:
      - "*"

jobs:
  build-release:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --onefile --name ssh-copy-id-${{ matrix.arch }} .\ssh-copy-id.py

      - name: Rename EXE to include tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $src = Join-Path $env:GITHUB_WORKSPACE "dist\ssh-copy-id-${{ matrix.arch }}.exe"
          $dst = Join-Path $env:GITHUB_WORKSPACE "dist\ssh-copy-id-${{ matrix.arch }}-$tag.exe"
          if (Test-Path $src) {
            Move-Item -Path $src -Destination $dst -Force
          } else {
            throw "Expected build output at $src but it was not found."
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-copy-id-${{ matrix.arch }}
          path: dist/*.exe

      - name: Create release if missing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --generate-notes
          }

      - name: Publish release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" (Get-ChildItem dist\*.exe | ForEach-Object { $_.FullName }) --clobber
