name: Release Windows EXE

on:
  push:
    tags:
      - "*"

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --onefile --name ssh-copy-id .\ssh-copy-id.py

      - name: Rename EXE to include tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $src = Join-Path $env:GITHUB_WORKSPACE "dist\ssh-copy-id.exe"
          $dst = Join-Path $env:GITHUB_WORKSPACE "dist\ssh-copy-id-$tag.exe"
          if (Test-Path $src) {
            Move-Item -Path $src -Destination $dst -Force
          } else {
            throw "Expected build output at $src but it was not found."
          }

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
